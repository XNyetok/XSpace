name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The app still supports macOS 14, but GitHub retired its macOS 14 runners.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      XSPACE_SELFTEST_OFFLINE: "1"
      XSPACE_WARNINGS_AS_ERRORS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build app bundle (ad-hoc signed, warnings are errors)
        run: ./scripts/build.sh

      - name: Self-test (offline)
        run: |
          build/XSpace.app/Contents/MacOS/XSpace --selftest
          build/XSpace.app/Contents/MacOS/XSpace --selftest-persist

      - name: UI self-test (offline)
        run: build/XSpace.app/Contents/MacOS/XSpace --selftest-ui
